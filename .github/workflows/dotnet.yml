name: .NET CI

on:
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Cache NuGet packages
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore InventoryDashboard.sln

      # Build solution (treat warnings as errors to enforce analyzer rules)
      - name: Build
        run: dotnet build InventoryDashboard.sln --configuration Release --no-restore -warnaserror

      # Run tests and collect code coverage
      - name: Run tests with coverage
        run: |
          for proj in $(find . -type f -name "*Tests.csproj"); do
            echo "Running tests for $proj"
            dotnet test "$proj" \
              --configuration Release \
              --no-build \
              --collect:"XPlat Code Coverage" \
              --settings SolutionItems/CodeCoverage.runsettings \
              --logger "trx;LogFileName=test_results.trx" \
              --results-directory ./TestResults
          done

      # Generate and publish HTML coverage report
      - name: Generate Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.3.11
        with:
          reports: '**/coverage.cobertura.xml'
          targetdir: 'coverage-report'
          reporttypes: 'Html'

      # Upload test results and coverage report as artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-results
          path: |
            TestResults/
            coverage-report/
